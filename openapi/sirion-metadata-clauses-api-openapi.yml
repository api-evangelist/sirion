openapi: 3.2.0
info:
  title: Sirion CLM API (Modeled) Metadata & Clauses API
  description: IMPORTANT - MODELED DOCUMENT.
  version: 1.0-modeled
  contact:
    name: SirionLabs
    url: https://www.sirion.ai
servers:
- url: https://{tenant}.sirioncloud.com
  description: Per-tenant SirionOne instance (MODELED host pattern on the confirmed product domain sirioncloud.com). Replace {tenant} with your organization's Sirion subdomain. The exact API path prefix is provisioned per tenant.
  variables:
    tenant:
      default: your-org
      description: Your organization's Sirion tenant subdomain.
security:
- oauth2ClientCredentials: []
tags:
- name: Metadata & Clauses
  description: Contract metadata fields and AI-extracted clauses (MODELED).
paths:
  /contracts/{contractId}/metadata:
    parameters:
    - $ref: '#/components/parameters/ContractId'
    get:
      operationId: getContractMetadata
      tags:
      - Metadata & Clauses
      summary: Get contract metadata (MODELED)
      responses:
        '200':
          description: Metadata fields for the contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateContractMetadata
      tags:
      - Metadata & Clauses
      summary: Update contract metadata (MODELED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Metadata'
      responses:
        '200':
          description: The updated metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /contracts/{contractId}/clauses:
    parameters:
    - $ref: '#/components/parameters/ContractId'
    get:
      operationId: listContractClauses
      tags:
      - Metadata & Clauses
      summary: List AI-extracted clauses for a contract (MODELED)
      responses:
        '200':
          description: A list of extracted clauses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Clause'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid OAuth access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Clause:
      type: object
      description: MODELED AI-extracted clause.
      properties:
        id:
          type: string
        type:
          type: string
        text:
          type: string
        confidence:
          type: number
    Metadata:
      type: object
      description: MODELED contract metadata field bag.
      properties:
        contractId:
          type: string
        fields:
          type: object
          additionalProperties: true
  parameters:
    ContractId:
      name: contractId
      in: path
      required: true
      description: The ID of the contract (MODELED).
      schema:
        type: string
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: 'OAuth 2.0 client credentials grant. CONFIRMED: a Sirion tenant admin generates an OAuth Client Id and OAuth Client Secret under Admin 2.0 -> Business API & Integrations (OAuth Client Setup), used to obtain an access token for the Sirion B2B APIs. The token URL below is MODELED / tenant-specific and must be replaced with your tenant''s actual token endpoint.'
      flows:
        clientCredentials:
          tokenUrl: https://your-org.sirioncloud.com/oauth/token
          scopes: {}
